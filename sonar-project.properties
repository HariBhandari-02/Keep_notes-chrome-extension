sonar.projectKey=keep_notes
sonar.projectName=Keep_notes
sonar.projectVersion=1.0.1

sonar.sources=src,website/src
sonar.tests=tests,website/tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx,website/tests/**/*.test.ts,website/tests/**/*.test.tsx

sonar.sourceEncoding=UTF-8
sonar.exclusions=dist/**,node_modules/**,coverage/**,**/*.d.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.node.maxspace=4096
